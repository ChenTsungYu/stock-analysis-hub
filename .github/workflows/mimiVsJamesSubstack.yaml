name: Fetch MimiVsJames Substack

on:
  schedule:
    - cron: "0 2 * * *"   # 每天台灣時間早上 10 點（UTC+8 → UTC 02:00）
  workflow_dispatch:        # 也可手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Fetch articles
        env:
          # CI always runs in fixed-cookie mode: GitHub Actions' shared-runner
          # IPs get flagged by Substack/Cloudflare's bot detection, so the
          # Playwright email/password login path (which needs Chromium) is
          # only usable locally. Refresh SUBSTACK_SID manually when it expires.
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
        run: |
          uv run python mimiVsJamesArticles/fetch_substack.py

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mimiVsJamesArticles/
          git diff --staged --quiet || git commit -m "chore: update articles $(date +'%Y-%m-%d')"
          git push
